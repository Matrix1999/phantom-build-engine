name: Build native media policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-media-policy:
    name: Compile native media policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out native sources
        uses: actions/checkout@v4

      - name: Configure Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-24" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build arm64 native library
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export PATH="${ANDROID_SDK_ROOT}/cmake/3.22.1/bin:${PATH}"
          cmake -S app/src/main/cpp -B build/native-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-arm64 --parallel 2
          test -f build/native-arm64/libpure_media_policy.so

      - name: Upload native library check artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-media-policy-native-arm64
          path: build/native-arm64/libpure_media_policy.so
          if-no-files-found: error
