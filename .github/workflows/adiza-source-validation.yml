name: Adiza source validation
on:
  workflow_dispatch:
    inputs:
      asset_id:
        required: true
        type: string
      release_id:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Download private source and delete staging
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" > /tmp/source.zip
          echo "$SOURCE_SHA256  /tmp/source.zip" | sha256sum -c -
          unzip -q /tmp/source.zip -d /tmp/source
          gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID"
          gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID"
          rm /tmp/source.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: stable
          cache: true
      - name: Resolve source dependencies
        working-directory: /tmp/source/Adiza Movies Box latest
        run: flutter pub get
      - name: Check changed application code
        working-directory: /tmp/source/Adiza Movies Box latest
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/api/catalogue_api.dart lib/api/models.dart lib/api/moviebox_client.dart lib/main.dart lib/providers/app_provider.dart lib/screens/detail_screen.dart lib/screens/player_screen.dart lib/screens/search_screen.dart lib/services/download_manager.dart lib/services/download_setup.dart test/catalogue_regression_test.dart test/download_setup_test.dart
      - name: Verify search, cast, recommendations, setup and existing size sheets
        working-directory: /tmp/source/Adiza Movies Box latest
        run: |
          dart test/playback_sources_test.dart
          dart test/download_validation_test.dart
          flutter test --no-pub --reporter expanded test/catalogue_regression_test.dart test/download_setup_test.dart test/source_sheet_widget_test.dart
