name: Build libcipher (amice)

# ─────────────────────────────────────────────────────────────────────────────
# Compiles guard.cpp → libcipher static archives using amice-VMP.
# Mirrors build-libphantom.yml exactly (same NDK r29, same amice download,
# same LD_LIBRARY_PATH layout) — just C++ instead of C.
#
# Outputs: libcipher_arm64.a + libcipher_armeabi-v7a.a
# Copy both to src/main/assets/ in the Dex2c project, then rebuild APK.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-cipher:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NDK r29 — same as build-libphantom.yml
      - name: Install NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      # Download amice plugin + libLLVM.so via GitHub API (private repo needs token)
      - name: Download libamice.so + libLLVM.so from amice-ndk-r29 release
        run: |
          REPO="${{ github.repository }}"
          TOKEN="${{ github.token }}"

          fetch_asset() {
            local name="$1" dest="$2"
            ASSET_ID=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/amice-ndk-r29" \
              | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id')
            if [ -z "$ASSET_ID" ]; then echo "❌ Asset not found: $name"; exit 1; fi
            curl -Lf -s \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
              -o "$dest"
            echo "✅ $name — $(du -sh "$dest" | cut -f1)"
          }

          fetch_asset "libamice-android-ndk-r29-linux-x86_64.so" "libamice.so"
          fetch_asset "libLLVM.so" "libLLVM.so"

      - name: Resolve toolchain paths
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TC=$TC"
            echo "SYSROOT=$TC/sysroot"
            echo "CLANGXX=$TC/bin/clang++"
            echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang++"
            echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang++"
            echo "LLVM_LIBDIR=$PWD"
            echo "AMICE_PLUGIN=$PWD/libamice.so"
          } >> "$GITHUB_ENV"

      # libamice.so was built against libedit.so.0 but Ubuntu ships libedit.so.2
      # Create the versioned symlink so the dynamic linker finds it
      - name: Fix libedit symlink for amice
        run: |
          LIBEDIT=$(find /usr/lib/x86_64-linux-gnu -name "libedit.so.2*" | head -1)
          echo "Found: $LIBEDIT"
          sudo ln -sf "$LIBEDIT" /usr/lib/x86_64-linux-gnu/libedit.so.0
          echo "✅ libedit.so.0 → $LIBEDIT"

      - name: Smoke-test amice plugin (arm64 + arm32)
        run: |
          cat > /tmp/smoke.cpp <<'CPPSRC'
          int foo(int x, int y) { int a=x^y; int b=a+x; if(a>0) return b; return b*y; }
          CPPSRC
          for TARGET in aarch64-linux-android26 armv7a-linux-androideabi21; do
            AMICE_STRING_ENCRYPTION=true AMICE_FLATTEN=true \
            LD_LIBRARY_PATH="$LLVM_LIBDIR" \
            "$CLANGXX" --target="$TARGET" --sysroot="$SYSROOT" \
              -std=c++17 -fPIC -O2 \
              -fpass-plugin="$AMICE_PLUGIN" \
              -c /tmp/smoke.cpp -o /tmp/smoke_${TARGET}.o
            echo "✅ $TARGET — amice OK"
          done

      - name: Build libcipher (arm64-v8a + armeabi-v7a)
        run: |
          set -e
          GUARD="guard.cpp"

          CPP_STATIC_ARM64=$(find "$TC" -name "libc++_static.a" | grep "aarch64"   | head -1)
          CPP_ABI_ARM64=$(   find "$TC" -name "libc++abi.a"     | grep "aarch64"   | head -1)
          CPP_STATIC_ARM32=$(find "$TC" -name "libc++_static.a" | grep "arm-linux" | head -1)
          CPP_ABI_ARM32=$(   find "$TC" -name "libc++abi.a"     | grep "arm-linux" | head -1)

          AMICE_PASSES=(
            # ── VMP ───────────────────────────────────────────────────────────
            AMICE_VM_VIRTUALIZE=true
            AMICE_CUSTOM_CALLING_CONV=true
            AMICE_CLONE_FUNCTION=true

            # ── Control flow ───────────────────────────────────────────────────
            AMICE_FLATTEN=true
            AMICE_FLATTEN_MODE=dominator
            AMICE_FLATTEN_LOOP_COUNT=1
            AMICE_FLATTEN_ALWAYS_INLINE=true

            AMICE_BOGUS_CONTROL_FLOW=true
            AMICE_BOGUS_CONTROL_FLOW_MODE=polaris-primes
            AMICE_BOGUS_CONTROL_FLOW_PROB=100
            AMICE_BOGUS_CONTROL_FLOW_LOOPS=1

            AMICE_LOWER_SWITCH=true
            AMICE_SPLIT_BASIC_BLOCK=true
            AMICE_SPLIT_BASIC_BLOCK_NUMS=3
            AMICE_SHUFFLE_BLOCKS=true
            AMICE_BASIC_BLOCK_OUTLINING=true

            # ── Indirect flow ──────────────────────────────────────────────────
            AMICE_INDIRECT_CALL=true
            AMICE_INDIRECT_BRANCH=true
            AMICE_INDIRECT_BRANCH_FLAGS=dummy_block,shuffle_table

            # ── Arithmetic & data ──────────────────────────────────────────────
            AMICE_MBA=true
            AMICE_MBA_AUX_COUNT=2
            AMICE_MBA_REWRITE_OPS=20
            AMICE_MBA_REWRITE_DEPTH=2

            AMICE_ALIAS_ACCESS=true
            AMICE_ALIAS_ACCESS_SHUFFLE_RAW_BOX=true
            AMICE_ALIAS_ACCESS_LOOSE_RAW_BOX=true

            AMICE_DELAY_OFFSET_LOADING=true
            AMICE_DELAY_OFFSET_LOADING_XOR_OFFSET=true

            AMICE_PARAM_AGGREGATE=true

            # ── Function structure ─────────────────────────────────────────────
            AMICE_FUNCTION_WRAPPER=true
            AMICE_FUNCTION_WRAPPER_PROBABILITY=100
            AMICE_FUNCTION_WRAPPER_TIMES=1

            # ── String encryption ──────────────────────────────────────────────
            AMICE_STRING_ENCRYPTION=true
            AMICE_STRING_ALGORITHM=simd_xor
            AMICE_STRING_INLINE_DECRYPT_FN=true
            AMICE_STRING_DECRYPT_TIMING=lazy

            LD_LIBRARY_PATH="$LLVM_LIBDIR"
          )

          COMMON_FLAGS=(
            --sysroot="$SYSROOT"
            -fpass-plugin="$AMICE_PLUGIN"
            -fPIC -O1 -g0 -std=c++17
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fexceptions -frtti
            -fvisibility=hidden
            -ffunction-sections -fdata-sections
            -D__ANDROID__ -DANDROID -DD2C_HAS_JNILOAD
            -I.
          )

          # ── arm64-v8a ──────────────────────────────────────────────────────
          echo "Building arm64-v8a…"
          env "${AMICE_PASSES[@]}" "$CLANGXX" --target=aarch64-linux-android26 \
            "${COMMON_FLAGS[@]}" -c "$GUARD" -o guard_arm64.o
          "$TC/bin/llvm-ar" rcs libcipher_arm64.a guard_arm64.o
          echo "  ✅ libcipher_arm64.a — $(wc -c < libcipher_arm64.a) bytes"

          # ── armeabi-v7a ────────────────────────────────────────────────────
          echo "Building armeabi-v7a…"
          env "${AMICE_PASSES[@]}" "$CLANGXX" --target=armv7a-linux-androideabi21 \
            "${COMMON_FLAGS[@]}" -c "$GUARD" -o guard_arm32.o
          "$TC/bin/llvm-ar" rcs libcipher_armeabi-v7a.a guard_arm32.o
          echo "  ✅ libcipher_armeabi-v7a.a — $(wc -c < libcipher_armeabi-v7a.a) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cipher-binaries-amice
          retention-days: 90
          path: |
            libcipher_arm64.a
            libcipher_armeabi-v7a.a
