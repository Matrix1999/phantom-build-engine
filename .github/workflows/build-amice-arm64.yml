name: Build libamice (arm64-android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'amice-vmp/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Install LLVM 19 dev headers (needed by llvm-sys at compile time) ──────
      - name: Install LLVM 19 dev
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm-19-dev libclang-19-dev clang-19 libffi-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> $GITHUB_ENV
          llvm-config-19 --version

      # ── Rust toolchain + aarch64-linux-android target ─────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            amice-vmp/target
          key: amice-arm64-${{ hashFiles('amice-vmp/Cargo.lock') }}
          restore-keys: amice-arm64-

      # ── Android NDK r29 ───────────────────────────────────────────────────────
      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      # ── Patch toolchain: symlink AR + create stub libs for llvm-sys linker ────
      # llvm-sys injects -lLLVM and -lffi into the Android cross-link command.
      # Neither exists in the NDK sysroot. We create empty stub .so files so the
      # linker succeeds. At runtime, LLVM symbols resolve from clang's process
      # (clang has LLVM statically linked); ffi is an internal LLVM dep never
      # called directly by the plugin. --allow-shlib-undefined lets dlopen succeed
      # even if the stubs export nothing.
      - name: Patch NDK for cross-link
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$NDK_BIN/aarch64-linux-android26-clang"

          # AR symlink (cc-rs looks for aarch64-linux-android-ar)
          ln -sf "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar"

          # Stub shared libs for -lLLVM and -lffi
          mkdir -p /tmp/android-stubs
          echo "void __stub(void){}" > /tmp/stub.c
          "$CLANG" -shared -fPIC /tmp/stub.c -o /tmp/android-stubs/libLLVM.so
          "$CLANG" -shared -fPIC /tmp/stub.c -o /tmp/android-stubs/libffi.so
          ls -lh /tmp/android-stubs/

          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          # --allow-shlib-undefined: symbols in stubs resolve at dlopen time from clang
          echo "RUSTFLAGS=-L /tmp/android-stubs -C link-arg=-Wl,--allow-shlib-undefined" >> $GITHUB_ENV

      # ── Cross-compile amice for aarch64-linux-android ─────────────────────────
      - name: Build libamice-arm64.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
        run: |
          cd amice-vmp

          cargo build --release \
            --target aarch64-linux-android \
            --no-default-features \
            --features android-ndk,llvm19-1 \
            -p amice

          SO="target/aarch64-linux-android/release/libamice.so"
          ls -lh "$SO"
          file "$SO"

          if ! file "$SO" | grep -q "ARM aarch64"; then
            echo "❌ Output is not aarch64 — aborting"
            exit 1
          fi

          cp "$SO" ../libamice-arm64.so
          echo "✅ libamice-arm64.so ready"

      # ── Smoke-test: exported symbols ───────────────────────────────────────────
      - name: Verify exported symbols
        run: |
          SO="libamice-arm64.so"
          readelf -d "$SO" | grep NEEDED || true
          nm -D "$SO" 2>/dev/null | grep -iE "amice|llvm_plugin|passPlugin" | head -20 || true
          echo "Size: $(du -sh "$SO" | cut -f1)"

      # ── Upload to Matrix1999/ollvm-19 as public release asset ─────────────────
      - name: Publish to ollvm-19 / amice-arm64 release
        env:
          OLLVM_PAT: ${{ secrets.GITHUB_PAT }}
          TARGET_REPO: Matrix1999/ollvm-19
          RELEASE_TAG: amice-arm64
        run: |
          ASSET="libamice-arm64.so"

          RELEASE_JSON=$(curl -sf \
            -H "Authorization: Bearer $OLLVM_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/releases/tags/$RELEASE_TAG" 2>/dev/null || true)

          if [ -z "$RELEASE_JSON" ] || echo "$RELEASE_JSON" | grep -q '"message":"Not Found"'; then
            echo "Creating release $RELEASE_TAG ..."
            RELEASE_JSON=$(curl -sf -X POST \
              -H "Authorization: Bearer $OLLVM_PAT" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$TARGET_REPO/releases" \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"amice arm64-android plugin\",\"body\":\"libamice-arm64.so — amice LLVM pass plugin for aarch64-linux-android.\",\"draft\":false,\"prerelease\":false}")
          fi

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          echo "Release ID: $RELEASE_ID"

          ASSET_ID=$(curl -sf \
            -H "Authorization: Bearer $OLLVM_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets" \
            | jq -r ".[] | select(.name==\"$ASSET\") | .id")

          if [ -n "$ASSET_ID" ]; then
            curl -sf -X DELETE \
              -H "Authorization: Bearer $OLLVM_PAT" \
              "https://api.github.com/repos/$TARGET_REPO/releases/assets/$ASSET_ID"
          fi

          curl -sf -X POST \
            -H "Authorization: Bearer $OLLVM_PAT" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets?name=$ASSET" \
            --data-binary "@$ASSET"

          echo "✅ Published: https://github.com/$TARGET_REPO/releases/download/$RELEASE_TAG/$ASSET"
