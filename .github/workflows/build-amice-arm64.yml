name: Build libvmp_plugin (arm64-android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'amice-vmp/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LLVM 19 dev
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm-19-dev libclang-19-dev clang-19 libffi-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> $GITHUB_ENV
          llvm-config-19 --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            amice-vmp/target
          key: amice-arm64-${{ hashFiles('amice-vmp/Cargo.lock') }}
          restore-keys: amice-arm64-

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Patch NDK for cross-link
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$NDK_BIN/aarch64-linux-android26-clang"
          ln -sf "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar"

          mkdir -p /tmp/android-stubs
          echo "void __stub(void){}" > /tmp/stub.c
          "$CLANG" -shared -fPIC /tmp/stub.c -o /tmp/android-stubs/libLLVM.so
          "$CLANG" -shared -fPIC /tmp/stub.c -o /tmp/android-stubs/libffi.so

          NDK_SYSROOT="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBCPP_DIR="$NDK_SYSROOT/usr/lib/aarch64-linux-android"
          LIBCPP_STATIC="$LIBCPP_DIR/libc++_static.a"
          LIBCPP_ABI="$LIBCPP_DIR/libc++abi.a"

          # The amice build.rs files explicitly emit cargo:rustc-link-lib=c++_shared
          # which forces -lc++_shared into the linker command — we cannot suppress
          # this via RUSTFLAGS alone. Solution: a linker wrapper that intercepts
          # every -lc++_shared argument and replaces it with the static .a files
          # before the real linker ever sees it.
          cat > /usr/local/bin/ndk-linker-wrap << WRAPPER
          #!/bin/bash
          REAL_LINKER="$CLANG"
          LIBCPP_STATIC_PATH="$LIBCPP_STATIC"
          LIBCPP_ABI_PATH="$LIBCPP_ABI"
          ARGS=()
          for arg in "\$@"; do
            if [ "\$arg" = "-lc++_shared" ]; then
              ARGS+=("\$LIBCPP_STATIC_PATH" "\$LIBCPP_ABI_PATH")
            else
              ARGS+=("\$arg")
            fi
          done
          exec "\$REAL_LINKER" "\${ARGS[@]}"
          WRAPPER
          chmod +x /usr/local/bin/ndk-linker-wrap

          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "LIBCPP_DIR=$LIBCPP_DIR" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L /tmp/android-stubs -C link-arg=-Wl,--allow-shlib-undefined" >> $GITHUB_ENV

      - name: Build libvmp_plugin.arm64.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/bin/ndk-linker-wrap
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
        run: |
          cd amice-vmp
          cargo build --release \
            --target aarch64-linux-android \
            --no-default-features \
            --features android-ndk,llvm19-1 \
            -p amice
          SO="target/aarch64-linux-android/release/libamice.so"
          ls -lh "$SO"
          file "$SO"
          if ! file "$SO" | grep -q "ARM aarch64"; then
            echo "❌ Output is not aarch64 — aborting"; exit 1
          fi
          cp "$SO" ../libvmp_plugin.arm64.so
          echo "✅ libvmp_plugin.arm64.so ready"

      - name: Verify — confirm libc++_shared.so is NOT needed
        run: |
          SO="libvmp_plugin.arm64.so"
          echo "=== NEEDED libs ==="
          readelf -d "$SO" | grep NEEDED || echo "(none)"
          if readelf -d "$SO" | grep -q "libc++_shared"; then
            echo "❌ FAIL: libc++_shared.so still in NEEDED"; exit 1
          fi
          echo "✅ No libc++_shared.so dependency"
          echo "Size: $(du -sh "$SO" | cut -f1)"

      - name: Publish to phantom-build-engine / amice-arm64 release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: amice-arm64
        run: |
          ASSET="libvmp_plugin.arm64.so"
          RELEASE_JSON=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ] || echo "$RELEASE_JSON" | grep -q '"message":"Not Found"'; then
            RELEASE_JSON=$(curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"VMP Plugin arm64-android\",\"draft\":false,\"prerelease\":false}")
          fi
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          OLD_ID=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets" \
            | jq -r ".[] | select(.name==\"$ASSET\") | .id")
          if [ -n "$OLD_ID" ]; then
            curl -sf -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/assets/$OLD_ID"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" \
            --data-binary "@$ASSET"
          echo "✅ Published: https://github.com/$REPO/releases/download/$TAG/$ASSET"
