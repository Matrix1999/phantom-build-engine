name: Build libphantom.so + encrypt blobs (amice-vmp)

on:
  workflow_dispatch:

jobs:
  build-phantom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard NDK r29 — sysroot + linker wrappers
      - name: Install NDK r29 (sysroot + linker)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Install Python (for encrypt_blob.py)
        run: sudo apt-get install -y --no-install-recommends python3

      - name: Download amice plugin + libLLVM.so from own release tag
        run: |
          BASE="https://github.com/Matrix1999/phantom-build-engine/releases/download/amice-ndk-r29"
          curl -L -s --retry 3 "$BASE/libamice-android-ndk-r29-linux-x86_64.so" -o libamice.so
          curl -L -s --retry 3 "$BASE/libLLVM.so" -o libLLVM.so
          chmod +x libamice.so
          echo "libamice.so : $(du -sh libamice.so | cut -f1)"
          echo "libLLVM.so  : $(du -sh libLLVM.so  | cut -f1)"

      - name: Resolve toolchain paths
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          LLVM_LIBDIR="$PWD"   # libLLVM.so is right here in the workspace root
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TC=$TC"
            echo "SYSROOT=$TC/sysroot"
            echo "CLANG=$TC/bin/clang"
            echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang"
            echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang"
            echo "LLVM_LIBDIR=$LLVM_LIBDIR"
            echo "AMICE_PLUGIN=$PWD/libamice.so"
          } >> "$GITHUB_ENV"

      - name: Smoke-test amice plugin (arm64 + arm32)
        run: |
          cat > /tmp/smoke.c <<'CSRC'
          int foo(int x, int y) { int a=x^y; int b=a+x; if(a>0) return b; return b*y; }
          CSRC
          for TARGET in aarch64-linux-android26 armv7a-linux-androideabi21; do
            AMICE_STRING_ENCRYPTION=true AMICE_FLATTEN=true \
            LD_LIBRARY_PATH="$LLVM_LIBDIR" \
            "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -fPIC -O2 \
              -fpass-plugin="$AMICE_PLUGIN" -c /tmp/smoke.c -o /tmp/smoke_${TARGET}.o
            echo "✅ $TARGET — amice OK"
          done

      - name: Write linker version script
        run: |
          cat > phantom.map <<'EOF'
          {
            global:
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeDecryptShard;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeWipeShard;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeWipeArtDex;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeLoadShards;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeSwapApplication;
            local: *;
          };
          EOF

      - name: Build libphantom.so (arm64-v8a + armeabi-v7a)
        timeout-minutes: 30
        run: |
          set -e
          SRC="Ultra Dex2c Vmp/src/main/cpp/phantom_key.c"

          AMICE_PASSES=(
            AMICE_FLATTEN=true
            AMICE_MBA=true
            AMICE_BOGUS_CONTROL_FLOW=true
            AMICE_INDIRECT_CALL=true
            AMICE_INDIRECT_BRANCH=true
            AMICE_SPLIT_BASIC_BLOCK=true
            AMICE_STRING_ENCRYPTION=true
            LD_LIBRARY_PATH="$LLVM_LIBDIR"
          )

          COMMON_FLAGS=(
            --sysroot="$SYSROOT" -fPIC -O2 -g0 -std=c11
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fvisibility=hidden -ffunction-sections -fdata-sections
            -fstack-protector-strong -D_FORTIFY_SOURCE=2
            -D__ANDROID__ -DANDROID
            -fpass-plugin="$AMICE_PLUGIN"
          )

          LDFLAGS=(
            -shared -fPIC -Wl,--gc-sections -Wl,--build-id=none
            -Wl,--version-script=phantom.map
            -Wl,-z,relro -Wl,-z,now -Wl,--strip-all -llog
          )

          echo "Building arm64-v8a..."
          env "${AMICE_PASSES[@]}" "$CLANG" --target=aarch64-linux-android26 \
            "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_arm64.o
          "$NDK_LINK_ARM64" "${LDFLAGS[@]}" -Wl,-soname,libphantom.so \
            phantom_arm64.o "$SYSROOT/usr/lib/aarch64-linux-android/libz.a" \
            -o libphantom_arm64.so
          echo "  OK $(wc -c < libphantom_arm64.so) bytes"

          echo "Building armeabi-v7a..."
          env "${AMICE_PASSES[@]}" "$CLANG" --target=armv7a-linux-androideabi21 \
            "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_arm32.o
          "$NDK_LINK_ARM32" "${LDFLAGS[@]}" -Wl,-soname,libphantom.so \
            phantom_arm32.o "$SYSROOT/usr/lib/arm-linux-androideabi/libz.a" \
            -o libphantom_arm.so
          echo "  OK $(wc -c < libphantom_arm.so) bytes"

      - name: Strip + harden
        run: |
          for SO in libphantom_arm64.so libphantom_arm.so; do
            "$TC/bin/llvm-strip" --strip-all "$SO"
            for SEC in .symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr; do
              "$TC/bin/llvm-objcopy" --remove-section="$SEC" "$SO" 2>/dev/null || true
            done
            echo "  $SO → $(wc -c < $SO) bytes"
          done

      - name: Verify JNI exports
        run: |
          for SO in libphantom_arm64.so libphantom_arm.so; do
            echo "=== $SO ==="
            "$TC/bin/llvm-nm" -D "$SO" | grep -E \
              'nativeLoadShards|nativeSwapApplication|nativeDecryptShard|nativeWipeShard|nativeWipeArtDex' || true
          done

      - name: Encrypt blobs
        run: |
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm64.so libphantom_arm64.blob
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm.so  libphantom_arm.blob
          ls -lh libphantom_arm64.blob libphantom_arm.blob

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-blobs-amice
          retention-days: 90
          path: |
            libphantom_arm64.blob
            libphantom_arm.blob
