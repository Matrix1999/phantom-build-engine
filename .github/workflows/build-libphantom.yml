name: Build libphantom.so + encrypt blobs (amice-vmp)

# ---------------------------------------------------------------------------
# Replaces the OLLVM build pipeline with amice-vmp (fuqiuluo/amice v0.1.5-beta.3).
#
# What changes vs OLLVM:
#   • No build-ollvm job — libamice.so is downloaded pre-built (7.8 MB, public)
#   • NDK r29 (LLVM 21) instead of r25c + OLLVM clang-19
#   • Obfuscation via -fpass-plugin=libamice.so + env vars instead of -mllvm flags
#   • arx_kdf + check_rooted get instruction-level VMP via __attribute__((annotate))
#   • All other functions get: CFG flatten, MBA, bogus-CF, indirect call/branch,
#     string encryption, basic-block splitting
#   • Blob encryption step identical — same encrypt_blob.py / ARX key
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  build-phantom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Install Python (for encrypt_blob.py)
        run: sudo apt-get install -y --no-install-recommends python3

      - name: Download libamice plugin (NDK r29, Linux x86_64)
        run: |
          curl -L -s --retry 3 \
            "https://github.com/fuqiuluo/amice/releases/download/v0.1.5-beta.3/libamice-android-ndk-r29-linux-x86_64.so" \
            -o libamice.so
          echo "libamice.so: $(du -sh libamice.so | cut -f1)"
          chmod +x libamice.so

      - name: Resolve toolchain paths
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          # libLLVM.so lives in lib64 (r29) — amice plugin needs it at runtime
          LLVM_LIBDIR="$TC/lib64"
          [ -d "$LLVM_LIBDIR" ] || LLVM_LIBDIR="$TC/lib"

          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TC=$TC"
            echo "SYSROOT=$TC/sysroot"
            echo "CLANG=$TC/bin/clang"
            echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang"
            echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang"
            echo "LLVM_LIBDIR=$LLVM_LIBDIR"
            echo "AMICE_PLUGIN=$PWD/libamice.so"
          } >> "$GITHUB_ENV"

      - name: Smoke-test amice plugin (arm64 + arm32)
        run: |
          cat > /tmp/smoke.c <<'EOF'
          int foo(int x, int y) {
            int a = x ^ y; int b = a + x; int c = b * y;
            if (a > 0) return b; else return c;
          }
          EOF

          # arm64
          AMICE_STRING_ENCRYPTION=true AMICE_FLATTEN=true \
          LD_LIBRARY_PATH="$LLVM_LIBDIR" \
          "$CLANG" --target=aarch64-linux-android26 \
            --sysroot="$SYSROOT" -fPIC -O2 \
            -fpass-plugin="$AMICE_PLUGIN" \
            -c /tmp/smoke.c -o /tmp/smoke_arm64.o
          echo "✅ arm64 — amice plugin loaded OK"

          # arm32
          AMICE_STRING_ENCRYPTION=true AMICE_FLATTEN=true \
          LD_LIBRARY_PATH="$LLVM_LIBDIR" \
          "$CLANG" --target=armv7a-linux-androideabi21 \
            --sysroot="$SYSROOT" -fPIC -O2 \
            -fpass-plugin="$AMICE_PLUGIN" \
            -c /tmp/smoke.c -o /tmp/smoke_arm32.o
          echo "✅ arm32 — amice plugin loaded OK"

      - name: Write linker version script
        run: |
          cat > phantom.map <<'EOF'
          {
            global:
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeDecryptShard;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeWipeShard;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeWipeArtDex;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeLoadShards;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeSwapApplication;
            local: *;
          };
          EOF

      - name: Build libphantom.so (arm64-v8a + armeabi-v7a)
        timeout-minutes: 30
        run: |
          set -e
          SRC="Ultra Dex2c Vmp/src/main/cpp/phantom_key.c"

          # ── Amice pass configuration ────────────────────────────────────────
          # arx_kdf + check_rooted get full instruction-level VMP via the
          # __attribute__((annotate("+vm_virtualize"))) in phantom_key.c.
          # All other functions get these global passes:
          #   FLATTEN          — control-flow flattening (dominator mode)
          #   MBA              — mixed boolean-arithmetic rewriting
          #   BOGUS_CONTROL_FLOW — bogus branches / opaque predicates
          #   INDIRECT_CALL    — call-site indirection via table
          #   INDIRECT_BRANCH  — branch indirection + index encryption
          #   SPLIT_BASIC_BLOCK — basic-block splitting
          #   STRING_ENCRYPTION — XOR/SIMD-XOR string hiding
          AMICE_PASSES=(
            AMICE_FLATTEN=true
            AMICE_MBA=true
            AMICE_BOGUS_CONTROL_FLOW=true
            AMICE_INDIRECT_CALL=true
            AMICE_INDIRECT_BRANCH=true
            AMICE_SPLIT_BASIC_BLOCK=true
            AMICE_STRING_ENCRYPTION=true
            LD_LIBRARY_PATH="$LLVM_LIBDIR"
          )

          COMMON_FLAGS=(
            --sysroot="$SYSROOT"
            -fPIC -O2 -g0
            -std=c11
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fvisibility=hidden
            -ffunction-sections -fdata-sections
            -fstack-protector-strong
            -D_FORTIFY_SOURCE=2
            -D__ANDROID__ -DANDROID
            -fpass-plugin="$AMICE_PLUGIN"
          )

          LDFLAGS=(
            -shared -fPIC
            -Wl,--gc-sections
            -Wl,--build-id=none
            -Wl,--version-script=phantom.map
            -Wl,-z,relro -Wl,-z,now
            -Wl,--strip-all
            -llog
          )

          # ── arm64-v8a ───────────────────────────────────────────────────────
          echo "Building arm64-v8a (amice-vmp)..."
          env "${AMICE_PASSES[@]}" \
          "$CLANG" --target=aarch64-linux-android26 \
            "${COMMON_FLAGS[@]}" \
            -c "$SRC" -o phantom_arm64.o
          "$NDK_LINK_ARM64" \
            "${LDFLAGS[@]}" \
            -Wl,-soname,libphantom.so \
            phantom_arm64.o \
            "$SYSROOT/usr/lib/aarch64-linux-android/libz.a" \
            -o libphantom_arm64.so
          echo "  OK libphantom_arm64.so — $(wc -c < libphantom_arm64.so) bytes"

          # ── armeabi-v7a ─────────────────────────────────────────────────────
          echo "Building armeabi-v7a (amice-vmp)..."
          env "${AMICE_PASSES[@]}" \
          "$CLANG" --target=armv7a-linux-androideabi21 \
            "${COMMON_FLAGS[@]}" \
            -c "$SRC" -o phantom_arm32.o
          "$NDK_LINK_ARM32" \
            "${LDFLAGS[@]}" \
            -Wl,-soname,libphantom.so \
            phantom_arm32.o \
            "$SYSROOT/usr/lib/arm-linux-androideabi/libz.a" \
            -o libphantom_arm.so
          echo "  OK libphantom_arm.so — $(wc -c < libphantom_arm.so) bytes"

      - name: Strip + harden
        run: |
          STRIP="$TC/bin/llvm-strip"
          OBJCOPY="$TC/bin/llvm-objcopy"
          for SO in libphantom_arm64.so libphantom_arm.so; do
            "$STRIP" --strip-all "$SO"
            for SEC in .symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr; do
              "$OBJCOPY" --remove-section="$SEC" "$SO" 2>/dev/null || true
            done
            echo "  $SO → $(wc -c < $SO) bytes"
          done

      - name: Verify JNI exports
        run: |
          NM="$TC/bin/llvm-nm"
          for SO in libphantom_arm64.so libphantom_arm.so; do
            echo "=== $SO ==="
            "$NM" -D "$SO" | grep -E \
              'nativeLoadShards|nativeSwapApplication|nativeDecryptShard|nativeWipeShard|nativeWipeArtDex' \
              || true
          done

      - name: Encrypt blobs (compress → ARX XOR → compress)
        run: |
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm64.so libphantom_arm64.blob
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm.so  libphantom_arm.blob
          echo "Blobs:"
          ls -lh libphantom_arm64.blob libphantom_arm.blob

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-blobs-amice
          retention-days: 90
          path: |
            libphantom_arm64.blob
            libphantom_arm.blob
