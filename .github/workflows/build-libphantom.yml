name: Build libphantom.so + encrypt blobs (amice-vmp)

on:
  workflow_dispatch:

jobs:
  build-phantom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard NDK r29 — sysroot + linker wrappers
      - name: Install NDK r29 (sysroot + linker)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Install Python (for encrypt_blob.py)
        run: sudo apt-get install -y --no-install-recommends python3

      - name: Test XChaCha20-Poly1305 implementation
        run: |
          cc -std=c11 -O2 -Wall -Wextra \
            "phantom_chacha20poly1305_test.c" \
            -o /tmp/phantom_xchacha_test
          /tmp/phantom_xchacha_test

      - name: Download amice plugin + libLLVM.so from release tag (API + token)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          fetch_asset() {
            local name="$1" dest="$2"
            ASSET_ID=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/amice-ndk-r29" \
              | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id')
            if [ -z "$ASSET_ID" ]; then echo "❌ Asset not found: $name"; exit 1; fi
            curl -Lf -s \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
              -o "$dest"
            echo "✅ $name — $(du -sh "$dest" | cut -f1)"
          }
          fetch_asset "libamice-android-ndk-r29-linux-x86_64.so" "libamice.so"
          fetch_asset "libLLVM.so" "libLLVM.so"

      - name: Fix libedit symlink for amice
        run: |
          LIBEDIT=$(find /usr/lib/x86_64-linux-gnu -name "libedit.so.2*" | head -1)
          sudo ln -sf "$LIBEDIT" /usr/lib/x86_64-linux-gnu/libedit.so.0
          echo "✅ libedit.so.0 → $LIBEDIT"

      - name: Resolve toolchain paths
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          LLVM_LIBDIR="$PWD"   # libLLVM.so is right here in the workspace root
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TC=$TC"
            echo "SYSROOT=$TC/sysroot"
            echo "CLANG=$TC/bin/clang"
            echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang"
            echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang"
            echo "LLVM_LIBDIR=$LLVM_LIBDIR"
            echo "AMICE_PLUGIN=$PWD/libamice.so"
          } >> "$GITHUB_ENV"

      - name: Smoke-test amice plugin (arm64 + arm32)
        run: |
          cat > /tmp/smoke.c <<'CSRC'
          __attribute__((annotate("+vm_virtualize,-vm_flatten")))
          int foo(int x, int y) { int a=x^y; int b=a+x; if(a>0) return b; return b*y; }
          static __attribute__((noinline)) int smoke_callee(int x) { return x ^ 0x35; }
          __attribute__((annotate("+indirect_call,-vm_virtualize,-vm_flatten")))
          int smoke_indirect_call(int x) { return smoke_callee(x) + 7; }
          __attribute__((annotate("+indirect_branch,-vm_virtualize,-vm_flatten")))
          int smoke_indirect_branch(int x) {
            int y = 0;
            for (int i = 0; i < 8; ++i) y += (x ^ i);
            return y > 9 ? y : y - 3;
          }
          __attribute__((annotate("+alias_access,-vm_virtualize,-vm_flatten")))
          int smoke_alias_access(int x) {
            int a = x + 11, b = x ^ 23;
            return (a * b) + (a ^ b);
          }
          __attribute__((annotate("+basic_block_outlining,-vm_virtualize,-vm_flatten")))
          int smoke_basic_block_outlining(int x) {
            int y = x;
            if (x & 1) {
              y += 3; y ^= 7; y += 13; y ^= 29;
            } else {
              y -= 5; y ^= 11; y -= 17; y ^= 31;
            }
            return y + 19;
          }
          __attribute__((annotate("+function_wrapper,-vm_virtualize,-vm_flatten")))
          int smoke_function_wrapper(int x) { return smoke_callee(x) + 41; }
          CSRC
          for TARGET in aarch64-linux-android26 armv7a-linux-androideabi21; do
            SMOKE_LOG="/tmp/smoke_${TARGET}.log"
            AMICE_VM_VIRTUALIZE=true \
            AMICE_VM_EMIT_MARKERS=true AMICE_VM_DUMP_BYTECODE=true \
            AMICE_VM_DUMP_LOWERING=true \
            AMICE_VM_FLATTEN=true \
            AMICE_INDIRECT_CALL=false \
            AMICE_INDIRECT_BRANCH=false \
            AMICE_INDIRECT_BRANCH_FLAGS=encrypt_block_index,shuffle_table \
            AMICE_FUNCTION_WRAPPER=false \
            AMICE_FUNCTION_WRAPPER_PROBABILITY=100 \
            AMICE_FUNCTION_WRAPPER_TIMES=1 \
            AMICE_ALIAS_ACCESS=false \
            AMICE_ALIAS_ACCESS_SHUFFLE_RAW_BOX=true \
            AMICE_ALIAS_ACCESS_LOOSE_RAW_BOX=false \
            AMICE_BASIC_BLOCK_OUTLINING=false \
            AMICE_BASIC_BLOCK_OUTLINING_MAX_EXTRACTOR_SIZE=1 \
            AMICE_MBA=false \
            AMICE_PASS_ORDER=VmVirtualize,VmFlatten,FunctionWrapper,AliasAccess,BasicBlockOutlining,IndirectCall,IndirectBranch,Mba \
            RUST_LOG=amice=debug \
            LD_LIBRARY_PATH="$LLVM_LIBDIR" \
            "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -fPIC -O2 \
              -fpass-plugin="$AMICE_PLUGIN" -c /tmp/smoke.c \
              -o "/tmp/smoke_${TARGET}.o" 2>&1 | tee "$SMOKE_LOG"
            if grep -q 'skip function "foo"' "$SMOKE_LOG" || \
                ! grep -q 'bytecode for "foo"' "$SMOKE_LOG"; then
              echo "❌ $TARGET — amice compiled but did not virtualize foo" >&2
              exit 1
            fi
            grep -Eq 'amice::aotu::indirect_call.*found [1-9][0-9]* likely functions and [1-9][0-9]* call instructions' \
              "$SMOKE_LOG" \
              || { echo "❌ $TARGET — indirect-call rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::function_wrapper.*creating wrapper' "$SMOKE_LOG" \
              || { echo "❌ $TARGET — function-wrapper rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::alias_access.*meta box count' "$SMOKE_LOG" \
              || { echo "❌ $TARGET — alias-access rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::basic_block_outlining.*bbs to outline' "$SMOKE_LOG" \
              || { echo "❌ $TARGET — basic-block outlining not reported" >&2; exit 1; }
            "$TC/bin/llvm-objdump" -dr --disassemble-symbols=smoke_indirect_call \
              "/tmp/smoke_${TARGET}.o" > "/tmp/smoke_icall_${TARGET}.txt"
            "$TC/bin/llvm-objdump" -dr --disassemble-symbols=smoke_indirect_branch \
              "/tmp/smoke_${TARGET}.o" > "/tmp/smoke_ibranch_${TARGET}.txt"
            if [ "$TARGET" = aarch64-linux-android26 ]; then
              grep -Eq '[[:space:]]blr[[:space:]]+x[0-9]+' "/tmp/smoke_icall_${TARGET}.txt" \
                || { echo "❌ $TARGET — indirect call instruction missing" >&2; exit 1; }
              grep -Eq '[[:space:]]br[[:space:]]+x[0-9]+' "/tmp/smoke_ibranch_${TARGET}.txt" \
                || { echo "❌ $TARGET — indirect branch instruction missing" >&2; exit 1; }
            else
              grep -Eq '[[:space:]]blx(\.w)?[[:space:]]+r[0-9]+' "/tmp/smoke_icall_${TARGET}.txt" \
                || { echo "❌ $TARGET — indirect call instruction missing" >&2; exit 1; }
              grep -Eq '[[:space:]](bx(\.w)?[[:space:]]+r([0-9]|1[0-2])|mov(\.w)?[[:space:]]+pc,[[:space:]]*r[0-9]+)' \
                "/tmp/smoke_ibranch_${TARGET}.txt" \
                || { echo "❌ $TARGET — indirect branch instruction missing" >&2; exit 1; }
            fi
            echo "✅ $TARGET — amice emitted VM markers"
            echo "✅ $TARGET — selective indirect call + branch instructions emitted"
          done

      - name: Write linker version script
        run: |
          cat > phantom.map <<'EOF'
          {
            global:
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeLoadShards;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeSwapApplication;
            local: *;
          };
          EOF

      - name: Generate authenticated Phantom string envelopes
        run: |
          set -e
          DIR="."
          python3 "$DIR/keygen_phantom_strings.py" > "$DIR/phantom_pstrings.inc.tmp"
          mv "$DIR/phantom_pstrings.inc.tmp" "$DIR/phantom_pstrings.inc"
          if grep -Eqi 'AES|CBC|PKCS7|PH_AES|MASTER_IV' \
              "$DIR/phantom_cipher.h" "$DIR/keygen_phantom_strings.py" \
              "$DIR/phantom_pstrings.inc" "$DIR/phantom_key.c"; then
            echo "Stale Phantom AES-CBC string contract detected" >&2
            exit 1
          fi
          grep -q 'XChaCha20-Poly1305 envelopes' "$DIR/phantom_pstrings.inc"

      - name: Build libphantom.so (arm64-v8a + armeabi-v7a)
        timeout-minutes: 30
        run: |
          set -eo pipefail
          SRC="phantom_key.c"
          INTEGRITY_INC="phantom_integrity.inc"
          STAMPER="stamp_phantom_integrity.py"
          cp "$INTEGRITY_INC" /tmp/phantom_integrity.placeholder.inc

          AMICE_PASSES=(
            AMICE_VM_VIRTUALIZE=true
            AMICE_VM_EMIT_MARKERS=true
            AMICE_VM_DUMP_BYTECODE=true
            AMICE_VM_DUMP_LOWERING=true
            AMICE_VM_FLATTEN=true
            AMICE_INDIRECT_CALL=false
            AMICE_INDIRECT_BRANCH=false
            AMICE_INDIRECT_BRANCH_FLAGS=encrypt_block_index,shuffle_table
            AMICE_FUNCTION_WRAPPER=false
            AMICE_FUNCTION_WRAPPER_PROBABILITY=100
            AMICE_FUNCTION_WRAPPER_TIMES=1
            AMICE_ALIAS_ACCESS=false
            AMICE_ALIAS_ACCESS_SHUFFLE_RAW_BOX=true
            AMICE_ALIAS_ACCESS_LOOSE_RAW_BOX=false
            AMICE_BASIC_BLOCK_OUTLINING=false
            AMICE_BASIC_BLOCK_OUTLINING_MAX_EXTRACTOR_SIZE=1
            AMICE_MBA=false
            AMICE_PASS_ORDER=VmVirtualize,VmFlatten,FunctionWrapper,AliasAccess,BasicBlockOutlining,IndirectCall,IndirectBranch,Mba
            RUST_LOG=amice=debug

            LD_LIBRARY_PATH="$LLVM_LIBDIR"
          )

          COMMON_FLAGS=(
            --sysroot="$SYSROOT" -fPIC -O2 -g0 -std=c11
            -Wformat=2 -Werror=format -Werror=implicit-function-declaration
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fvisibility=hidden -ffunction-sections -fdata-sections
            -fstack-protector-strong -D_FORTIFY_SOURCE=2
            -D__ANDROID__ -DANDROID
            -fpass-plugin="$AMICE_PLUGIN"
          )

          LDFLAGS=(
            -shared -fPIC -Wl,--gc-sections -Wl,--build-id=none
            -Wl,--version-script=phantom.map
            -Wl,-z,relro -Wl,-z,now -Wl,-z,separate-code -Wl,--strip-all
          )

          build_arm64() {
            env "${AMICE_PASSES[@]}" "$CLANG" --target=aarch64-linux-android26 \
              "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_arm64.o 2>&1 \
              | tee /tmp/phantom_arm64_amice.log
            "$NDK_LINK_ARM64" "${LDFLAGS[@]}" -Wl,-soname,libphantom.so \
              phantom_arm64.o "$SYSROOT/usr/lib/aarch64-linux-android/libz.a" \
              -o libphantom_arm64.so
          }

          build_arm32() {
            env "${AMICE_PASSES[@]}" "$CLANG" --target=armv7a-linux-androideabi21 \
              "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_arm32.o 2>&1 \
              | tee /tmp/phantom_arm32_amice.log
            "$NDK_LINK_ARM32" "${LDFLAGS[@]}" -Wl,-soname,libphantom.so \
              phantom_arm32.o "$SYSROOT/usr/lib/arm-linux-androideabi/libz.a" \
              -o libphantom_arm.so
          }

          echo "Building and stamping arm64-v8a..."
          cp /tmp/phantom_integrity.placeholder.inc "$INTEGRITY_INC"
          build_arm64
          echo "  OK $(wc -c < libphantom_arm64.so) bytes; integrity placeholder present"

          echo "Building and stamping armeabi-v7a..."
          cp /tmp/phantom_integrity.placeholder.inc "$INTEGRITY_INC"
          build_arm32
          echo "  OK $(wc -c < libphantom_arm.so) bytes; integrity placeholder present"

      - name: Selective indirect call + branch audit
        run: |
          set -e
          grep -q '+mba' phantom_cipher.h
          grep -q '+indirect_branch' phantom_cipher.h
          grep -q '+indirect_call' phantom_key.c
          for OBJ in phantom_arm64.o phantom_arm32.o; do
            if [ "$OBJ" = phantom_arm64.o ]; then
              ABI=arm64
              CALL_PATTERN='[[:space:]]blr[[:space:]]+x[0-9]+'
              BRANCH_PATTERN='[[:space:]]br[[:space:]]+x[0-9]+'
            else
              ABI=arm32
              CALL_PATTERN='[[:space:]]blx(\.w)?[[:space:]]+r[0-9]+'
              BRANCH_PATTERN='[[:space:]](bx(\.w)?[[:space:]]+r([0-9]|1[0-2])|mov(\.w)?[[:space:]]+pc,[[:space:]]*r[0-9]+)'
            fi
            LOG="/tmp/phantom_${ABI}_amice.log"
            grep -Eq 'amice::aotu::indirect_call.*found [1-9][0-9]* likely functions and [1-9][0-9]* call instructions' \
              "$LOG" \
              || { echo "$OBJ: indirect-call rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::function_wrapper.*creating wrapper' "$LOG" \
              || { echo "$OBJ: function-wrapper rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::alias_access.*meta box count' "$LOG" \
              || { echo "$OBJ: alias-access rewrite not reported" >&2; exit 1; }
            grep -q 'amice::aotu::basic_block_outlining.*bbs to outline' "$LOG" \
              || { echo "$OBJ: basic-block outlining rewrite not reported" >&2; exit 1; }
            CALL_DISASM="/tmp/${ABI}_derive_shard_key.txt"
            BRANCH_DISASM="/tmp/${ABI}_ph_build_str_key.txt"
            "$TC/bin/llvm-objdump" -dr --disassemble-symbols=derive_shard_key \
              "$OBJ" | tee "$CALL_DISASM"
            "$TC/bin/llvm-objdump" -dr --disassemble-symbols=ph_build_str_key \
              "$OBJ" | tee "$BRANCH_DISASM"
            grep -Eq "$CALL_PATTERN" "$CALL_DISASM" \
              || { echo "$OBJ: indirect call instruction missing" >&2; exit 1; }
            grep -Eq "$BRANCH_PATTERN" "$BRANCH_DISASM" \
              || { echo "$OBJ: indirect branch instruction missing" >&2; exit 1; }
            echo "✅ $OBJ — selective indirect call + encrypted/shuffled indirect branch instructions present"
          done

      - name: VMP section audit (arm64 + arm32)
        run: |
          set -e
          PATTERN="ph_pstring_prepare_vm|ph_pstring_decrypt_vm|ph_pstring_auth_policy_vm|ph_pstring_scrub_key[0-3]_vm|ph_pstring_scrub_aad_vm|ph_pstring_unmask_vm|detect_ptrace|detect_frida|detect_proc_dump_artifacts|detect_phantom_self_integrity|detect_ebpf|detect_riru|detect_root|detect_linker_maps|check_rooted|nuke_app|hook_phdr|collect_exec|parse_maps|fetch_checksum|scan_executable|check_frida_port|ph_strings|stage_policy|stage_apply|stage_hchacha_vm|stage_hchacha_qr_vm|stage_decrypt"
          for OBJ in phantom_arm64.o phantom_arm32.o; do
            if [ "$OBJ" = "phantom_arm64.o" ]; then
              ABI="arm64"
            else
              ABI="arm32"
            fi
            SECTION_REPORT="amice-vmp-${ABI}-report.txt"
            SECTION_FILE="/tmp/${ABI}_phantom_sections.txt"

            echo "======================================================"
            echo "$OBJ - VMP protection audit"
            echo "======================================================"

            echo ""
            echo "--- VMP marker sections (.amice.vm.*) ---"
            readelf -S --wide "$OBJ" > "$SECTION_FILE"
            if ! grep -E "amice\.vm|vm\.meta|vm\.bc|vm\.bytecode" \
                "$SECTION_FILE" > "$SECTION_REPORT"; then
              echo "No VMP marker sections found in $OBJ" >&2
              exit 1
            fi
            head -80 "$SECTION_REPORT"

            echo ""
            echo "--- All amice-related section names ---"
            awk '{print $2}' "$SECTION_FILE" | grep -i "amice" | sort -u | head -60 || true

            echo ""
            echo "--- VMP section count ---"
            VM_COUNT=$(grep -cE "amice\.vm|vm\.meta|vm\.bc" "$SECTION_FILE" || true)
            echo "amice.vm.* sections found: $VM_COUNT"

            echo ""
            echo "--- Detection function symbol sizes (pre-strip) ---"
            "$TC/bin/llvm-nm" --print-size --size-sort "$OBJ" 2>/dev/null | grep -iE "$PATTERN" | sort -k2 -rn || echo "(none visible)"

            echo ""
            echo "--- Required Phantom VM markers ($ABI) ---"
            for target in \
              ph_pstring_prepare_vm \
              ph_pstring_decrypt_vm \
              ph_pstring_auth_policy_vm \
              ph_pstring_scrub_key0_vm \
              ph_pstring_scrub_key1_vm \
              ph_pstring_scrub_key2_vm \
              ph_pstring_scrub_key3_vm \
              ph_pstring_scrub_aad_vm \
              ph_pstring_unmask_vm \
              ph_load_begin \
              ph_load_advance \
              ph_load_fail \
              check_rooted \
              ph_self_hash_range \
              ph_self_finalize_digest \
              ph_self_compare_word \
              ph_self_enforcement_policy \
              nuke_app \
              sha256_block \
              vm_dl_iterate_phdr \
              vm_read_one_line \
              vm_spawn_watcher \
              ph_stage_policy_vm; do
              if grep -q "amice\.vm.*${target}" "$SECTION_FILE"; then
                echo "✅ ${target}"
              else
                echo "❌ Missing AMICE marker for ${target}" >&2
                exit 1
              fi
            done

            echo ""
            echo "--- Linker/map consistency detector ---"
            echo "✅ Removed from the pre-decrypt gate to avoid Android linker-layout false positives"

            echo ""
            echo "--- Key-path VMP bytecode requirements ($ABI) ---"
            KEY_PATH_OK=true
            for target in \
              stage_root_word0_vm \
              stage_root_word1_vm \
              stage_root_word2_vm \
              stage_root_word3_vm \
              stage_root_word4_vm \
              stage_root_word5_vm \
              stage_root_word6_vm \
              stage_root_word7_vm \
              stage_root_group0_vm \
              stage_root_group1_vm \
              stage_apply \
              stage_hchacha_constants_vm \
              stage_hchacha_nonce0_vm \
              stage_hchacha_nonce1_vm \
              stage_hchacha_nonce2_vm \
              stage_hchacha_nonce3_vm \
              stage_hchacha_prepare_vm \
              stage_hchacha_qr_vm \
              stage_hchacha_column_vm \
              stage_hchacha_diagonal_vm \
              stage_hchacha_round_vm \
              stage_hchacha_rounds0_vm \
              stage_hchacha_rounds1_vm \
              stage_hchacha_rounds2_vm \
              stage_hchacha_store_vm \
              stage_hchacha_vm \
              stage_bridge; do
              if grep -q "amice\.vm\.bytecode\.${target}" "$SECTION_FILE" && \
                  grep -q "amice\.vm\.meta\.${target}" "$SECTION_FILE"; then
                echo "✅ ${target} has explicit Amice VM bytecode + metadata"
              else
                echo "❌ ${target} is not present as an explicit Amice VM function" >&2
                KEY_PATH_OK=false
              fi
            done
            if [ "$KEY_PATH_OK" != true ]; then
              exit 1
            fi

            echo ""
            echo "--- Key-path native dispatch audit ($ABI) ---"
            for target in stage_apply stage_hchacha_vm stage_hchacha_qr_vm stage_decrypt; do
              DISASM_FILE="/tmp/${ABI}_${target}_dispatch.txt"
              "$TC/bin/llvm-objdump" -dr --disassemble-symbols="$target" "$OBJ" \
                | tee "$DISASM_FILE"
            done

            echo ""
          done

          echo "--- Exact VMP metadata baseline comparison ---"
          for ABI in arm64 arm32; do
            if [ "$ABI" = arm64 ]; then
              OBJ=phantom_arm64.o
            else
              OBJ=phantom_arm32.o
            fi
            ACTUAL="/tmp/${ABI}_vmp_metadata.txt"
            awk '{
              for (i = 1; i <= NF; ++i) {
                value = $i
                sub(/^\.?amice\.vm\.meta\./, "", value)
                if (value != $i && value !~ /^module/) print value
              }
            }' < <(readelf -SW "$OBJ") | sort -u > "$ACTUAL"
            diff -u <(sort -u "phantom-vmp-baseline-${ABI}.txt") "$ACTUAL"
            EXPECTED=$(wc -l < "phantom-vmp-baseline-${ABI}.txt")
            ACTUAL_COUNT=$(wc -l < "$ACTUAL")
            [ "$ACTUAL_COUNT" -eq "$EXPECTED" ] \
              || { echo "$ABI: VMP metadata count changed ($EXPECTED -> $ACTUAL_COUNT)" >&2; exit 1; }
            echo "✅ $ABI — exact VMP metadata baseline preserved ($ACTUAL_COUNT targets)"
          done

      - name: Strip + harden
        run: |
          STAMPER="stamp_phantom_integrity.py"
          for SO in libphantom_arm64.so libphantom_arm.so; do
            "$TC/bin/llvm-strip" --strip-all "$SO"
            for SEC in .symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr; do
              "$TC/bin/llvm-objcopy" --remove-section="$SEC" "$SO" 2>/dev/null || true
            done
            HASH=$(python3 "$STAMPER" "$SO" --patch-elf "$SO")
            python3 "$STAMPER" "$SO" --expect "$HASH" --verify-embedded >/dev/null
            echo "  $SO → $(wc -c < $SO) bytes"
          done

      - name: Verify ELF hardening
        run: |
          set -e
          for SO in libphantom_arm64.so libphantom_arm.so; do
            echo "Checking $SO"
            PROGRAM_HEADERS=$(readelf -lW "$SO")
            DYNAMIC=$(readelf -dW "$SO")
            SECTIONS=$(readelf -SW "$SO")

            echo "$PROGRAM_HEADERS" | grep -q "GNU_RELRO" \
              || { echo "Missing GNU_RELRO in $SO" >&2; exit 1; }
            echo "$DYNAMIC" | grep -Eq "BIND_NOW|NOW" \
              || { echo "Missing BIND_NOW in $SO" >&2; exit 1; }
            STACK_LINE=$(echo "$PROGRAM_HEADERS" | grep "GNU_STACK" || true)
            if echo "$STACK_LINE" | grep -q "RWE"; then
              echo "Executable GNU_STACK in $SO" >&2
              exit 1
            fi

            for SEC in .symtab .strtab .comment .eh_frame .eh_frame_hdr; do
              if echo "$SECTIONS" | grep -Eq "[[:space:]]${SEC}[[:space:]]"; then
                echo "Unstripped section $SEC remains in $SO" >&2
                exit 1
              fi
            done

            for SYMBOL in pthread_create prctl dlopen dlsym system; do
              if readelf -Ws "$SO" 2>/dev/null | grep -Eq "[[:space:]]${SYMBOL}(@|$)"; then
                echo "Forbidden dynamic symbol $SYMBOL remains in $SO" >&2
                exit 1
              fi
            done
            echo "  RELRO + NOW + non-executable stack + stripped symbols: OK"
          done

      - name: Reject static payload-key patterns
        run: |
          python3 - <<'PY'
          import re
          import struct
          from pathlib import Path

          native = Path(
              "phantom_key.c"
          ).read_text()

          if "uint32_t material[8];" in native or "ctx->material" in native:
              raise SystemExit("native stage context still carries key material")

          material_parts = re.findall(
              r"PH_DEFINE_ROOT_STAGE\(\s*(\d+)\s*,\s*0x([0-9a-fA-F]{8})u\s*\)",
              native,
          )
          material_parts.sort(key=lambda item: int(item[0]))
          if [int(i) for i, _ in material_parts] != list(range(8)):
              raise SystemExit("VMP-local stage material cases are incomplete")
          encoded_material = b"".join(
              struct.pack("<I", int(word, 16))
              for _, word in material_parts
          )
          payload_key = b""
          for i, word in material_parts:
              index = int(i)
              value = int(word, 16)
              mix = 0xA5A5A5A5 ^ (index * 0x9E3779B9 & 0xFFFFFFFF)
              rotate = (index % 5) + 3
              add = (0x31415927 + index * 0x01020304) & 0xFFFFFFFF
              value ^= mix
              value = ((value >> rotate) | (value << (32 - rotate))) & 0xFFFFFFFF
              value = (value - add) & 0xFFFFFFFF
              payload_key += struct.pack("<I", value)
          if len(payload_key) != 32:
              raise SystemExit("native VMP key reconstruction did not produce 32 bytes")

          forbidden = {
              "universal payload key": payload_key,
              "encoded stage material": encoded_material,
          }

          for name in ("libphantom_arm64.so", "libphantom_arm.so"):
              data = Path(name).read_bytes()
              for label, pattern in forbidden.items():
                  offset = data.find(pattern)
                  if offset >= 0:
                      raise SystemExit(
                          f"{name}: {label} is contiguous at 0x{offset:x}")
              print(f"[scan] {name}: no contiguous payload-key patterns")
          PY

      - name: Verify JNI exports
        run: |
          for SO in libphantom_arm64.so libphantom_arm.so; do
            echo "=== $SO ==="
            EXPORTED=$("$TC/bin/llvm-nm" -D --defined-only "$SO" \
              | awk '{print $3}' \
              | grep '^Java_com_ultra_dex2cvmp_utils_DexCrypto_' || true)
            printf '%s\n' "$EXPORTED"
            printf '%s\n' "$EXPORTED" | grep -qx \
              'Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeLoadShards'
            printf '%s\n' "$EXPORTED" | grep -qx \
              'Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeSwapApplication'
            if printf '%s\n' "$EXPORTED" | grep -Eq \
              'nativeDecryptShard|nativeWipeShard|nativeWipeArtDex'; then
              echo "Legacy DEX JNI export detected in $SO" >&2
              exit 1
            fi
          done

      - name: Reject stale plaintext DEX loader paths
        run: |
          set -e
          SRC="phantom_key.c"
          if grep -Eq \
            'PH_USE_LEGACY_JAVA_DEX_BUFFERS|PHANTOM_ENABLE_LEGACY_DECRYPT_SHARD|nativeDecryptShard|nativeWipeShard|nativeWipeArtDex|NewByteArray|SetByteArrayRegion|ByteBuffer\.wrap|PH_ENABLE_ART_DEX_WIPE' \
            "$SRC"; then
            echo "Stale plaintext Java-array or incomplete ART-wipe path found" >&2
            exit 1
          fi
          grep -q 'NewDirectByteBuffer' "$SRC"
          grep -q 'InMemoryDexClassLoader' "$SRC"
          echo "✅ direct native DEX path only; stale Java-array paths absent"

      - name: Encrypt blobs
        run: |
          python3 "encrypt_blob.py" libphantom_arm64.so libphantom_arm64.blob
          python3 "encrypt_blob.py" libphantom_arm.so  libphantom_arm.blob
          ls -lh libphantom_arm64.blob libphantom_arm.blob

      - name: Install generated Phantom blobs into project assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSET_DIR="."
          mkdir -p "$ASSET_DIR"
          if [ "$(realpath "$ASSET_DIR")" != "$(pwd)" ]; then
            cp libphantom_arm64.blob "$ASSET_DIR/libphantom_arm64.blob"
            cp libphantom_arm.blob "$ASSET_DIR/libphantom_arm.blob"
          else
            echo "Flattened repository: generated Phantom blobs are already in the asset directory"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ASSET_DIR/libphantom_arm64.blob" "$ASSET_DIR/libphantom_arm.blob"
          if git diff --cached --quiet; then
            echo "Phantom blobs are already current"
            exit 0
          fi
          git commit -m "Refresh Phantom runtime blobs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phantom-blobs-amice
          retention-days: 90
          path: |
            libphantom_arm64.blob
            libphantom_arm.blob
            amice-vmp-arm64-report.txt
            amice-vmp-arm32-report.txt
