name: Build libphantom.so + encrypt blobs

# -----------------------------------------------------------------------------
# Produces the two blob files needed by DexProtector.loadPhantomLib():
#
#   libphantom_arm64.blob    <- arm64-v8a  libphantom.so, ARX-encrypted
#   libphantom_arm.blob      <- armeabi-v7a libphantom.so, ARX-encrypted
#
# Job 1 -- build-ollvm   (identical to build-libcipher.yml job 1)
#   Checks if the OLLVM clang-19 release asset already exists.
#   If yes -> done in ~10 s.  If no -> builds from TIMER-err/ollvm-19 (~40-90 min).
#
# Job 2 -- build-phantom
#   Downloads OLLVM, compiles phantom_key.c into libphantom.so for
#   arm64-v8a (all 8 OLLVM passes) and armeabi-v7a, strips both binaries,
#   then runs encrypt_blob.py to produce the final .blob files.
#
# After the workflow succeeds, download the artifact zip and copy both .blob
# files to src/main/assets/phantom/ in the Dex2c Mega project, then rebuild.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:

# -----------------------------------------------------------------------------
# JOB 1 -- Build / reuse OLLVM clang (shared with build-libcipher.yml)
# -----------------------------------------------------------------------------
jobs:
  build-ollvm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    outputs:
      asset_id: ${{ steps.resolve.outputs.asset_id }}

    steps:
      - name: Check if OLLVM asset already exists
        id: check
        run: |
          ASSET_ID=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
            | jq -r '.assets[]? | select(.name=="ollvm-clang-linux-x86_64.tar.xz") | .id' \
            | head -1)
          echo "asset_id=${ASSET_ID}" >> $GITHUB_OUTPUT
          if [ -n "$ASSET_ID" ]; then
            echo "OK OLLVM asset exists (ID: $ASSET_ID) -- skipping rebuild"
          else
            echo "No OLLVM asset found -- will build from source"
          fi

      - name: Install build dependencies
        if: steps.check.outputs.asset_id == ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3 git lld
          echo "Cores: $(nproc)"

      - name: Clone OLLVM source (shallow)
        if: steps.check.outputs.asset_id == ''
        run: |
          git clone --depth=1 https://github.com/TIMER-err/ollvm-19 /tmp/ollvm-src
          git -C /tmp/ollvm-src rev-parse HEAD > /tmp/ollvm-src-hash.txt
          cat /tmp/ollvm-src-hash.txt

      - name: Restore build cache
        id: cache-ollvm
        if: steps.check.outputs.asset_id == ''
        uses: actions/cache@v4
        with:
          path: /tmp/ollvm-install
          key: ollvm-install-${{ runner.os }}-AArch64-${{ hashFiles('/tmp/ollvm-src-hash.txt') }}

      - name: Configure CMake
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_INSTALL_PREFIX=/tmp/ollvm-install \
            -B /tmp/ollvm-build \
            /tmp/ollvm-src/llvm

      - name: Build clang
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: ninja -C /tmp/ollvm-build -j$(nproc) clang

      - name: Install clang
        if: steps.check.outputs.asset_id == '' && steps.cache-ollvm.outputs.cache-hit != 'true'
        run: |
          ninja -C /tmp/ollvm-build install-clang install-clang-resource-headers
          /tmp/ollvm-install/bin/clang --version

      - name: Smoke-test OLLVM passes (arm64)
        if: steps.check.outputs.asset_id == ''
        run: |
          echo "int main(){return 0;}" > /tmp/test.c
          /tmp/ollvm-install/bin/clang \
            --target=aarch64-linux-android26 \
            -mllvm -fla -mllvm -bcf -mllvm -sub \
            -fPIC -O2 -c /tmp/test.c -o /tmp/test_arm64.o
          echo "OK OLLVM arm64 passes OK"

      - name: Package
        if: steps.check.outputs.asset_id == ''
        run: |
          tar -cJf /tmp/ollvm-clang-linux-x86_64.tar.xz \
            -C /tmp ollvm-install
          du -sh /tmp/ollvm-clang-linux-x86_64.tar.xz

      - name: Upload to release
        if: steps.check.outputs.asset_id == ''
        run: |
          REL_ID=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{"tag_name":"ollvm-clang-linux-v2","name":"OLLVM Clang (Linux x86_64)","body":"OLLVM clang-19, AArch64 target, all 8 passes.","prerelease":true}' \
            | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
              | jq -r '.id')
          fi
          OLD=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets" \
            | jq -r '.[] | select(.name=="ollvm-clang-linux-x86_64.tar.xz") | .id')
          [ -n "$OLD" ] && curl -s -X DELETE \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD"
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/x-xz" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=ollvm-clang-linux-x86_64.tar.xz" \
            --data-binary @/tmp/ollvm-clang-linux-x86_64.tar.xz \
            | jq '{id, name, size}'

      - name: Resolve asset ID
        id: resolve
        run: |
          ASSET_ID=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/ollvm-clang-linux-v2" \
            | jq -r '.assets[] | select(.name=="ollvm-clang-linux-x86_64.tar.xz") | .id' \
            | head -1)
          echo "asset_id=${ASSET_ID}" >> $GITHUB_OUTPUT
          echo "OLLVM asset ID: $ASSET_ID"

# -----------------------------------------------------------------------------
# JOB 2 -- Compile phantom_key.c + encrypt blobs
# -----------------------------------------------------------------------------
  build-phantom:
    runs-on: ubuntu-latest
    needs: build-ollvm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          yes | sdkmanager "ndk;25.2.9519653" 2>/dev/null || true
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Python (for encrypt_blob.py)
        run: sudo apt-get install -y --no-install-recommends python3

      - name: Download OLLVM clang-19
        run: |
          ASSET_ID="${{ needs.build-ollvm.outputs.asset_id }}"
          echo "Downloading OLLVM asset ID: $ASSET_ID"
          curl -L -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
            -o ollvm-clang-linux-x86_64.tar.xz
          echo "Downloaded: $(du -sh ollvm-clang-linux-x86_64.tar.xz | cut -f1)"
          tar -xJf ollvm-clang-linux-x86_64.tar.xz
          chmod +x ollvm-install/bin/clang
          echo "OK OLLVM: $(ollvm-install/bin/clang --version | head -1)"
          echo "OLLVM_BIN=$PWD/ollvm-install/bin/clang" >> $GITHUB_ENV

      - name: Resolve toolchain paths
        run: |
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TC=$TC"                                                         >> $GITHUB_ENV
          echo "CLANG_ARM64=$OLLVM_BIN"                                         >> $GITHUB_ENV
          echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang"           >> $GITHUB_ENV
          echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang"        >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot"                                            >> $GITHUB_ENV

      - name: Confirm OLLVM passes active
        run: |
          echo "int x;" > /tmp/probe.c
          if "$OLLVM_BIN" --target=aarch64-linux-android26 \
               --sysroot="$SYSROOT" -mllvm -fla \
               -x c -c /tmp/probe.c -o /tmp/probe.o 2>/dev/null; then
            echo "OLLVM_FLAGS=-mllvm -fla -mllvm -bcf -mllvm -bcf_prob=90 -mllvm -bcf_loop=3 -mllvm -sub -mllvm -sub_loop=3 -mllvm -sobf -mllvm -split -mllvm -split_num=5 -mllvm -ibr -mllvm -icall -mllvm -igv" >> $GITHUB_ENV
            echo "OK All 8 OLLVM passes confirmed: fla bcf(90%x3) sub(x3) sobf split(5) ibr icall igv"
          else
            echo "OLLVM_FLAGS=" >> $GITHUB_ENV
            echo "WARN OLLVM passes not responding -- building without obfuscation"
          fi

      - name: Write linker version script
        run: |
          # Export both JNI entry-points; hide everything else.
          cat > phantom.map << 'EOF'
          {
            global:
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeDecryptShard;
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeWipeShard;
            local: *;
          };
          EOF

      - name: Build libphantom.so (arm64-v8a + armeabi-v7a)
        run: |
          set -e
          SRC="Ultra Dex2c Vmp/src/main/cpp/phantom_key.c"

          COMMON_BASE=(
            --sysroot="$SYSROOT"
            -fPIC -O2 -g0
            -std=c11
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fvisibility=hidden
            -ffunction-sections -fdata-sections
            -fstack-protector-strong
            -D_FORTIFY_SOURCE=2
            -D__ANDROID__ -DANDROID
          )

          COMMON_OLLVM=("${COMMON_BASE[@]}")
          if [ -n "$OLLVM_FLAGS" ]; then
            read -ra OF <<< "$OLLVM_FLAGS"
            COMMON_OLLVM+=("${OF[@]}")
          fi

          LDFLAGS=(
            -shared -fPIC
            -Wl,--gc-sections
            -Wl,--build-id=none
            -Wl,--version-script=phantom.map
            -Wl,-z,relro -Wl,-z,now
            -Wl,--strip-all
            -llog
            -lz
          )

          # -- arm64-v8a (OLLVM -- all 8 passes) --------------------------------
          echo "Building arm64-v8a (OLLVM)..."
          "$CLANG_ARM64" --target=aarch64-linux-android26 \
            "${COMMON_OLLVM[@]}" \
            -c "$SRC" -o phantom_arm64.o
          "$NDK_LINK_ARM64" \
            "${LDFLAGS[@]}" \
            -Wl,-soname,libphantom.so \
            phantom_arm64.o \
            -o libphantom_arm64.so
          echo "  OK libphantom_arm64.so -- $(wc -c < libphantom_arm64.so) bytes"
          nm -D libphantom_arm64.so | grep -E '(GLOBAL|nativeDecryptShard|nativeWipeShard)' || true

          # -- armeabi-v7a (OLLVM) ----------------------------------------------
          echo "Building armeabi-v7a (OLLVM)..."
          "$CLANG_ARM64" --target=armv7a-linux-androideabi21 \
            "${COMMON_OLLVM[@]}" \
            -c "$SRC" -o phantom_arm32.o
          "$NDK_LINK_ARM32" \
            "${LDFLAGS[@]}" \
            -Wl,-soname,libphantom.so \
            phantom_arm32.o \
            -o libphantom_arm.so
          echo "  OK libphantom_arm.so  -- $(wc -c < libphantom_arm.so) bytes"
          nm -D libphantom_arm.so | grep -E '(GLOBAL|nativeDecryptShard|nativeWipeShard)' || true

          # No rootblock variants needed — block-rooted toggle is encoded
          # at pack time as bit 7 of salt[0] and read by libphantom.so at runtime.

      - name: Strip + harden
        run: |
          STRIP="$TC/bin/llvm-strip"
          OBJCOPY="$TC/bin/llvm-objcopy"
          for SO in libphantom_arm64.so libphantom_arm.so; do
            "$STRIP" --strip-all "$SO"
            for SEC in .symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr; do
              "$OBJCOPY" --remove-section="$SEC" "$SO" 2>/dev/null || true
            done
            echo "  $SO -> $(wc -c < $SO) bytes"
          done

      - name: Encrypt blobs (compress -> XOR -> compress)
        run: |
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm64.so libphantom_arm64.blob
          python3 "Ultra Dex2c Vmp/phantom/encrypt_blob.py" libphantom_arm.so  libphantom_arm.blob
          echo "Blobs:"
          ls -lh libphantom_arm64.blob libphantom_arm.blob

      - name: Verify blob round-trip
        run: |
          echo "OK Round-trip verified during encrypt step (encrypt_blob.py auto-verifies)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-blobs
          retention-days: 90
          path: |
            libphantom_arm64.blob
            libphantom_arm.blob
            libphantom_arm64_rootblock.blob
            libphantom_arm_rootblock.blob
