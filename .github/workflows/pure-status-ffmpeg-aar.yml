name: Pure Status Pro — FFmpegKitNext AAR Build

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "GitHub Release asset ID containing the Android-only source ZIP"
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    name: Build FFmpegKitNext AAR
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            unzip zip wget curl jq python3 ninja-build \
            autoconf automake libtool libtool-bin gettext autopoint pkg-config

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK, NDK, and CMake
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Download Android-only source asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/source /tmp/extracted /tmp/project
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            --output /tmp/source/source.zip
          unzip -q /tmp/source/source.zip -d /tmp/extracted

          # The upload should contain only an android/ directory at its root.
          # This prevents Phantom from classifying the native app as React Native.
          if [ -d /tmp/extracted/android ]; then
            cp -a /tmp/extracted/android/. /tmp/project/
          else
            TOP="$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"
            if [ -n "${TOP}" ] && [ -f "${TOP}/settings.gradle.kts" ]; then
              cp -a "${TOP}/." /tmp/project/
            else
              cp -a /tmp/extracted/. /tmp/project/
            fi
          fi

          test -f /tmp/project/settings.gradle.kts
          test -f /tmp/project/gradlew
          test -f /tmp/project/tools/build-ffmpeg-kit-next.sh
          echo "Native Android project staged:"
          find /tmp/project -maxdepth 2 -type f | sort | sed -n '1,120p'

      - name: Restore FFmpegKitNext build cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/project/native/ffmpeg-kit-next
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ffmpeg-kit-next-${{ runner.os }}-v9.0.0-api24-ndk27d-cache-v1
          restore-keys: |
            ffmpeg-kit-next-${{ runner.os }}-v9.0.0-api24-ndk27d-

      - name: Build the pinned local FFmpegKitNext AAR
        working-directory: /tmp/project
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmake/3.22.1/bin:${PATH}"
          export FFMPEG_KIT_NEXT_REF=v9.0.0
          export FFMPEG_KIT_NEXT_JOBS=2
          chmod +x gradlew tools/build-ffmpeg-kit-next.sh
          if ! ./tools/build-ffmpeg-kit-next.sh; then
            echo "----- FFmpegKitNext build.log -----"
            cat native/ffmpeg-kit-next/build.log || true
            exit 1
          fi
          test -d native/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven

      - name: Package FFmpegKitNext Maven repository
        working-directory: /tmp/project
        run: |
          test -d native/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven
          tar -czf /tmp/ffmpeg-kit-next-maven.tar.gz \
            -C native/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven .
          sha256sum /tmp/ffmpeg-kit-next-maven.tar.gz | tee /tmp/ffmpeg-kit-next-maven.sha256

      - name: Upload FFmpegKitNext AAR bundle
        uses: actions/upload-artifact@v4
        with:
          name: pure-status-pro-ffmpeg-kit-next-aar
          path: |
            /tmp/ffmpeg-kit-next-maven.tar.gz
            /tmp/ffmpeg-kit-next-maven.sha256
          if-no-files-found: error
          retention-days: 14