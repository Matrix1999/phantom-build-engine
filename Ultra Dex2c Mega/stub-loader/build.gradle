plugins {
    id 'com.android.library'
}

android {
    namespace 'com.ultra.dex2cvmp'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies — stub must only use Android framework APIs.
