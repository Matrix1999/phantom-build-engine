name: Build Phantom bootstrap (portable)

on:
  workflow_dispatch:

jobs:
  build-phantom-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Resolve toolchain paths
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TC=$TC"
            echo "SYSROOT=$TC/sysroot"
            echo "CLANG=$TC/bin/clang"
            echo "NDK_LINK_ARM64=$TC/bin/aarch64-linux-android26-clang"
            echo "NDK_LINK_ARM32=$TC/bin/armv7a-linux-androideabi21-clang"
          } >> "$GITHUB_ENV"

      - name: Write bootstrap linker version script
        run: |
          cat > phantom-bootstrap.map <<'EOF'
          {
            global:
              Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeDecryptBlob;
            local: *;
          };
          EOF

      - name: Build bootstrap for ARM64 and ARM
        run: |
          set -e
          SRC="Ultra Dex2c Mega/src/main/cpp/phantom_source/phantom_bootstrap.c"
          COMMON_FLAGS=(
            --sysroot="$SYSROOT" -fPIC -O2 -g0 -std=c11
            -fno-unwind-tables -fno-asynchronous-unwind-tables
            -fvisibility=hidden -ffunction-sections -fdata-sections
            -fstack-protector-strong -D_FORTIFY_SOURCE=2
            -D__ANDROID__ -DANDROID
          )
          LDFLAGS=(
            -shared -fPIC -Wl,--gc-sections -Wl,--build-id=none
            -Wl,--version-script=phantom-bootstrap.map
            -Wl,-z,relro -Wl,-z,now -Wl,--strip-all
          )

          "$CLANG" --target=aarch64-linux-android26 \
            "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_bootstrap_arm64.o
          "$NDK_LINK_ARM64" "${LDFLAGS[@]}" -Wl,-soname,libphantom_bootstrap.so \
            phantom_bootstrap_arm64.o "$SYSROOT/usr/lib/aarch64-linux-android/libz.a" \
            -o libbootstrap_arm64.so

          "$CLANG" --target=armv7a-linux-androideabi21 \
            "${COMMON_FLAGS[@]}" -c "$SRC" -o phantom_bootstrap_arm32.o
          "$NDK_LINK_ARM32" "${LDFLAGS[@]}" -Wl,-soname,libphantom_bootstrap.so \
            phantom_bootstrap_arm32.o "$SYSROOT/usr/lib/arm-linux-androideabi/libz.a" \
            -o libbootstrap_arm.so

      - name: Verify bootstrap crypto and key contract
        run: |
          set -euo pipefail
          SRC_DIR="Ultra Dex2c Mega/src/main/cpp/phantom_source"
          cc -std=c11 -O2 -Wall -Wextra -I "$SRC_DIR" \
            "$SRC_DIR/phantom_chacha20poly1305_test.c" \
            -o phantom_chacha20poly1305_test
          ./phantom_chacha20poly1305_test

          python3 - <<'PY'
          import hashlib
          import re
          import struct
          from pathlib import Path

          source = Path(
              "Ultra Dex2c Mega/src/main/cpp/phantom_source/phantom_bootstrap.c"
          ).read_text()
          stages = re.findall(
              r"PH_DEFINE_BLOB_STAGE\(\s*(\d+)\s*,\s*0x([0-9a-fA-F]{8})u\s*\)",
              source,
          )
          stages.sort(key=lambda item: int(item[0]))
          if [int(index) for index, _ in stages] != list(range(8)):
              raise SystemExit("bootstrap key stages are incomplete")

          decoded = bytearray()
          encoded = bytearray()
          for index_text, value_text in stages:
              index = int(index_text)
              value = int(value_text, 16)
              encoded += struct.pack("<I", value)
              mix = 0xA5A5A5A5 ^ ((index * 0x9E3779B9) & 0xFFFFFFFF)
              rotate = (index % 5) + 3
              add = (0x31415927 + index * 0x01020304) & 0xFFFFFFFF
              value ^= mix
              value = ((value >> rotate) | (value << (32 - rotate))) & 0xFFFFFFFF
              value = (value - add) & 0xFFFFFFFF
              decoded += struct.pack("<I", value)

          expected = hashlib.sha256(b"phantom-outer-xchacha-v1").digest()
          if bytes(decoded) != expected:
              raise SystemExit("bootstrap key does not match encrypt_blob.py")

          for name in ("libbootstrap_arm64.so", "libbootstrap_arm.so"):
              data = Path(name).read_bytes()
              if expected in data:
                  raise SystemExit(f"{name}: decoded blob key is contiguous")
              if bytes(encoded) in data:
                  raise SystemExit(f"{name}: encoded key stages are contiguous")
              print(f"{name}: key contract OK; no contiguous key material")
          PY

      - name: Strip and harden bootstrap libraries
        run: |
          set -e
          for SO in libbootstrap_arm64.so libbootstrap_arm.so; do
            "$TC/bin/llvm-strip" --strip-all "$SO"
            for SEC in .symtab .strtab .comment .note.android.ident .eh_frame .eh_frame_hdr; do
              "$TC/bin/llvm-objcopy" --remove-section="$SEC" "$SO" 2>/dev/null || true
            done
          done

      - name: Verify bootstrap JNI exports
        run: |
          set -e
          for SO in libbootstrap_arm64.so libbootstrap_arm.so; do
            EXPORTED=$("$TC/bin/llvm-nm" -D --defined-only "$SO" \
              | awk '{print $3}')
            printf '%s\n' "$EXPORTED" | grep -qx \
              'Java_com_ultra_dex2cvmp_utils_DexCrypto_nativeDecryptBlob'
          done

      - name: Install bootstrap assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSET_DIR="Ultra Dex2c Mega/src/main/assets/phantom"
          mkdir -p "$ASSET_DIR"
          cp libbootstrap_arm64.so "$ASSET_DIR/libbootstrap_arm64.so"
          cp libbootstrap_arm.so "$ASSET_DIR/libbootstrap_arm.so"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ASSET_DIR/libbootstrap_arm64.so" \
            "$ASSET_DIR/libbootstrap_arm.so"
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Phantom bootstrap assets"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-bootstrap-portable
          retention-days: 90
          path: |
            libbootstrap_arm64.so
            libbootstrap_arm.so
            amice-vmp-arm64-report.txt
            amice-vmp-arm32-report.txt